      async startReviewSet() {
        const activeLang = this.getActiveLanguage();
        const earlierUnlocked = CONFIG.languages.filter(
          l => l.order < activeLang.order && this.state.languages[l.id]?.unlocked
        );

        this.session = { mode: "review_set", loading: true };
        this.renderMainView();

        const sys = `Generate 4 rapid spaced-repetition review multiple-choice questions for CodeQuest.
3 questions MUST be on ${activeLang.name} (${this.state.reviewDeck.slice(0, 4).map(d => d.topic).join("; ")}).
${earlierUnlocked.length > 0 ? `1 question MUST be a refresher from an earlier language (${earlierUnlocked.map(l => l.name).join(", ")}).` : `All 4 questions on ${activeLang.name}.`}
Include correctAnswerText with the exact winning string from options. Keep explanations concise (1 sentence).`;

        const schema = {
          type: "OBJECT",
          properties: {
            questions: {
              type: "ARRAY",
              items: {
                type: "OBJECT",
                properties: {
                  languageName: { type: "STRING" },
                  topic: { type: "STRING" },
                  prompt: { type: "STRING" },
                  codeSnippet: { type: "STRING" },
                  options: { type: "ARRAY", items: { type: "STRING" } },
                  correctOptionIndex: { type: "INTEGER" },
                  correctAnswerText: { type: "STRING" },
                  explanation: { type: "STRING" }
                },
                required: ["languageName", "topic", "prompt", "codeSnippet", "options", "correctOptionIndex", "correctAnswerText", "explanation"]
              }
            }
          },
          required: ["questions"]
        };

        let questions;
        try {
          const res = await callGeminiJSON(sys, "Generate 4 spaced repetition review questions.", schema);
          questions = this.normalizeQuizQuestions(res.questions);
        } catch (e) {
          questions = this.getFallbackQuizQuestions(activeLang, 4).map(q => ({
            ...q,
            languageName: activeLang.name,
            topic: q.topicTag
          }));
        }

        this.session = {
          mode: "review_set",
          loading: false,
          questions,
          index: 0,
          selectedOption: null,
          submitted: false,
          lastCorrect: false,
          correctCount: 0,
          done: false
        };
        this.renderMainView();

        if (activeLang.executionMode === "pyodide" && Array.isArray(questions)) {
          questions.forEach(q => this.reconcileQuestionWithPyodide(q));
        }
      }

      renderActiveReviewSet(s) {
        if (s.loading) {
          return `
            <div class="py-20 text-center space-y-3">
              <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-400 mx-auto flex items-center justify-center text-xl animate-spin">
                <i class="fa-solid fa-circle-notch"></i>
              </div>
              <p class="text-sm font-bold text-white">Assembling your Spaced Repetition set...</p>
            </div>
          `;
        }

        if (s.done) {
          return `
            <div class="max-w-md mx-auto rounded-3xl bg-slate-900 border border-emerald-500/40 p-7 text-center space-y-4 animate-pop">
              <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center text-2xl">
                <i class="fa-solid fa-brain"></i>
              </div>
              <h2 class="text-xl font-extrabold text-white">Review Set Complete! (${s.correctCount}/${s.questions.length})</h2>
              <p class="text-xs text-slate-300">+30 XP earned and Leitner review intervals updated.</p>
              <button onclick="app.exitReviewSet()" class="btn-game w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">
                Back to Review Deck
              </button>
            </div>
          `;
        }

        const q = s.questions[s.index];
        return `
          <div class="max-w-xl mx-auto space-y-4 animate-pop">
            <div class="flex items-center justify-between text-xs text-slate-400">
              <button onclick="app.exitReviewSet()" class="hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i>Back</button>
              <span class="font-bold text-indigo-400">${this.escapeHTML(q.languageName)} • ${this.escapeHTML(q.topic)}</span>
              <span>Card ${s.index + 1}/${s.questions.length}</span>
            </div>

            <div class="rounded-3xl bg-slate-900 border border-slate-800 p-6 space-y-4">
              <h3 class="text-base sm:text-lg font-bold text-white">${this.escapeHTML(q.prompt)}</h3>
              <pre class="code-font text-xs sm:text-sm bg-slate-950 border border-slate-800 rounded-2xl p-4 overflow-x-auto text-indigo-200">${this.escapeHTML(q.codeSnippet)}</pre>
              <div class="grid grid-cols-1 gap-2">
                ${q.options.map((opt, idx) => {
                  let cls = "bg-slate-950 border-slate-800 text-slate-200";
                  if (s.submitted) {
                    if (idx === q.correctOptionIndex) cls = "bg-emerald-950/50 border-emerald-500 text-emerald-200";
                    else if (idx === s.selectedOption) cls = "bg-rose-950/50 border-rose-500 text-rose-200";
                  } else if (s.selectedOption === idx) {
                    cls = "bg-indigo-600/25 border-indigo-500 text-white";
                  }
                  return `
                    <button ${s.submitted ? "disabled" : ""} onclick="app.selectQuizOption(${idx})" class="p-3.5 rounded-xl border text-left text-xs sm:text-sm font-medium ${cls}">
                      ${this.escapeHTML(opt)}
                    </button>
                  `;
                }).join("")}
              </div>

              ${s.submitted ? `
                <div class="rounded-xl bg-slate-950 border border-slate-800 p-3.5 text-xs text-slate-300 space-y-1.5">
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-bold ${s.lastCorrect ? 'text-emerald-400' : 'text-rose-400'}">
                      ${s.lastCorrect ? "✓ Correct" : "✗ Incorrect"}
                    </span>
                    ${!s.lastCorrect ? `
                      <button onclick="app.overrideReviewMarkCorrect()" class="px-2.5 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700 text-[11px] font-semibold text-slate-300 hover:text-emerald-300">
                        ✓ My Answer Was Right
                      </button>
                    ` : ""}
                  </div>
                  <p>${this.escapeHTML(q.explanation)}</p>
                </div>
                <button onclick="app.nextReviewCard()" class="btn-game w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">
                  Next Card
                </button>
              ` : `
                <button onclick="app.submitReviewAnswer()" class="btn-game w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">
                  Check Recall
                </button>
              `}
            </div>
          </div>
        `;
      }

      async submitReviewAnswer() {
        const s = this.session;
        if (!s || s.selectedOption === null) return;
        const q = s.questions[s.index];
        if (this.getActiveLanguage().executionMode === "pyodide") {
          await this.reconcileQuestionWithPyodide(q);
        }
        const matchedByText = q.correctAnswerText
          ? this.findMatchingOptionIndex(q.options, q.correctAnswerText) === s.selectedOption
          : false;
        const isRight = (s.selectedOption === q.correctOptionIndex) || matchedByText;
        if (isRight) q.correctOptionIndex = s.selectedOption;

        s.submitted = true;
        s.lastCorrect = isRight;
        if (isRight) {
          this.sfx.play("correct");
          s.correctCount++;
        } else {
          this.sfx.play("wrong");
        }
        this.renderMainView();
      }

      overrideReviewMarkCorrect() {
        const s = this.session;
        if (!s || !s.submitted || s.lastCorrect) return;
        const q = s.questions[s.index];
        q.correctOptionIndex = s.selectedOption;
        s.lastCorrect = true;
        s.correctCount++;
        this.sfx.play("correct");
        this.showToast("Marked as correct!", "emerald", "fa-solid fa-check");
        this.renderMainView();
      }

      nextReviewCard() {
        const s = this.session;
        if (!s) return;
        if (s.index + 1 < s.questions.length) {
          s.index++;
          s.selectedOption = null;
          s.submitted = false;
          s.lastCorrect = false;
          this.renderMainView();
        } else {
          s.done = true;
          this.state.xp += 30;
          this.state.daily.reviewSetsDone++;
          this.state.reviewDeck.forEach(card => {
            card.box = Math.min(5, card.box + 1);
            card.nextDue = Date.now() + card.box * 6 * 60 * 60 * 1000;
          });
          if (this.isDailyGoalComplete() && !this.state.daily.completedBannerShown) {
            this.state.daily.completedBannerShown = true;
            this.unlockBadge("daily_hero");
          }
          fireConfetti();
          this.saveState();
          this.renderAll();
        }
      }

      exitReviewSet() {
        this.session = null;
        this.renderAll();
      }

      renderBadgesView() {
        return `
          <div class="space-y-6 animate-pop">
            <div class="rounded-3xl bg-slate-900 border border-slate-800 p-6 flex items-center justify-between">
              <div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-white">Achievements &amp; Player Stats</h1>
                <p class="text-xs text-slate-400 mt-1">Player Level ${this.getPlayerLevel()} • ${this.state.xp} Total XP • ${this.state.streak}-Day Streak</p>
              </div>
              <div class="text-right">
                <span class="text-2xl font-black text-indigo-400">${this.state.badges.length}/${CONFIG.badges.length}</span>
                <div class="text-[11px] text-slate-400">Badges Earned</div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
              ${CONFIG.badges.map(b => {
                const earned = this.state.badges.includes(b.id);
                return `
                  <div class="p-5 rounded-2xl border ${
                    earned ? "bg-slate-900 border-indigo-500/40" : "bg-slate-900/40 border-slate-800/70 opacity-60"
                  } flex items-start gap-4">
                    <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shrink-0 ${
                      earned ? "bg-indigo-500/20 text-indigo-300 border border-indigo-500/30" : "bg-slate-800 text-slate-500"
                    }">
                      <i class="${b.icon}"></i>
                    </div>
                    <div>
                      <h3 class="font-bold text-white text-sm">${b.name}</h3>
                      <p class="text-xs text-slate-400 mt-0.5">${b.desc}</p>
                      <span class="inline-block mt-2 text-[10px] font-bold uppercase ${earned ? 'text-emerald-400' : 'text-slate-500'}">
                        ${earned ? "✓ Unlocked" : "Locked"}
                      </span>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      selectLanguage(langId) {
        if (!this.state.languages[langId]?.unlocked) {
          this.promptEarlyUnlock(langId);
          return;
        }
        this.state.activeLangId = langId;
        this.saveState();
        this.navigate("levels");
      }

      promptEarlyUnlock(langId) {
        const targetLang = CONFIG.languages.find(l => l.id === langId);
        const curLang = this.getActiveLanguage();
        if (!targetLang) return;

        this.showModal(`
          <div class="space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-lg">
                <i class="fa-solid fa-unlock-keyhole"></i>
              </div>
              <div>
                <h3 class="text-lg font-extrabold text-white">Unlock ${targetLang.name} Early?</h3>
                <p class="text-xs text-slate-400">World #${targetLang.order} in the learning path</p>
              </div>
            </div>
            <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">
              Finishing <strong>${curLang.name}</strong> first usually works better so your mental model stays focused on one language at a time—but it's your journey, and you can unlock <strong>${targetLang.name}</strong> right now if you need it.
            </p>
            <div class="flex gap-3 pt-2">
              <button onclick="app.closeModal()" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold">
                Stay on ${curLang.name}
              </button>
              <button onclick="app.confirmEarlyUnlock('${targetLang.id}')" class="flex-1 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold">
                Unlock ${targetLang.name} Now
              </button>
            </div>
          </div>
        `);
      }

      confirmEarlyUnlock(langId) {
        if (this.state.languages[langId]) {
          this.state.languages[langId].unlocked = true;
          this.state.languages[langId].earlyUnlocked = true;
          this.state.activeLangId = langId;
          this.saveState();
        }
        this.closeModal();
        this.showToast(`${CONFIG.languages.find(l => l.id === langId)?.name} unlocked!`, "amber", "fa-solid fa-unlock");
        this.navigate("levels");
      }

      openHeartsModal() {
        this.showModal(`
          <div class="space-y-4 text-center">
            <div class="w-14 h-14 rounded-2xl bg-rose-500/20 text-rose-400 mx-auto flex items-center justify-center text-2xl">
              <i class="fa-solid fa-heart"></i>
            </div>
            <h3 class="text-lg font-extrabold text-white">Hearts: ${this.state.hearts} / ${CONFIG.maxHearts}</h3>
            <p class="text-xs sm:text-sm text-slate-300">
              Hearts protect your focus and encourage thoughtful attempts. They refill automatically (1 heart every 15 minutes), or you can do a quick recall refill now.
            </p>
            <div class="flex gap-3 pt-2">
              <button onclick="app.closeModal()" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold">
                Close
              </button>
              ${this.state.hearts < CONFIG.maxHearts ? `
                <button onclick="app.refillHeartsWithPractice()" class="flex-1 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-extrabold">
                  Instant Practice Refill (+2 Hearts)
                </button>
              ` : ""}
            </div>
          </div>
        `);
      }

      refillHeartsWithPractice() {
        this.state.hearts = Math.min(CONFIG.maxHearts, this.state.hearts + 2);
        if (this.state.hearts >= CONFIG.maxHearts) this.state.lastHeartLostAt = null;
        this.saveState();
        this.closeModal();
        this.updateHeaderStats();
        this.showToast("+2 Hearts restored! Keep coding.", "emerald", "fa-solid fa-heart");
      }

      openResetModal() {
        let savedKey = "";
        try {
          savedKey = localStorage.getItem("codequest_custom_api_key") || "";
        } catch (e) {}

        this.showModal(`
          <div class="space-y-4 max-h-[82vh] overflow-y-auto pr-1">
            <h3 class="text-lg font-extrabold text-white">Settings, Sync &amp; Phone Setup</h3>
            <p class="text-xs text-slate-400">
              Model in config: <code class="code-font text-indigo-300">${CONFIG.model}</code> • Cached levels: ${Object.keys(this.cache).length}
            </p>

            <!-- Optional Gemini API Key for standalone exported HTML -->
            <div class="space-y-1.5 pt-1">
              <label class="text-xs font-semibold text-slate-300 block">
                Gemini API Key <span class="text-slate-500 font-normal">(Used when exported on PC or Phone)</span>
              </label>
              <div class="flex gap-2">
                <input
                  id="custom-api-key-input"
                  type="password"
                  value="${this.escapeHTML(savedKey)}"
                  placeholder="AIzaSy... (leave blank in preview)"
                  class="flex-1 px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs code-font text-white focus:border-indigo-500 focus:outline-none"
                />
                <button onclick="app.saveCustomApiKey()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold">
                  Save
                </button>
              </div>
            </div>

            <!-- Cross-Device Progress Sync (PC <-> Phone) -->
            <div class="rounded-xl bg-slate-950 border border-slate-800 p-3.5 space-y-2.5">
              <div class="text-xs font-bold text-indigo-300 flex items-center gap-1.5">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>Move Progress Between PC &amp; Phone</span>
              </div>
              <p class="text-[11px] text-slate-400 leading-relaxed">
                Copy your save code on one device and paste it on another to sync your XP, unlocked levels, and streak.
              </p>
              <div class="flex gap-2">
                <button onclick="app.copySaveCode()" class="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold">
                  <i class="fa-regular fa-copy mr-1"></i>Copy Save Code
                </button>
                <button onclick="app.importSaveCode()" class="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-indigo-300 text-xs font-bold">
                  <i class="fa-solid fa-file-import mr-1"></i>Load Save Code
                </button>
              </div>
              <input
                id="save-code-input"
                type="text"
                placeholder="Paste save code here to restore..."
                class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs code-font text-slate-200 focus:border-indigo-500 focus:outline-none"
              />
            </div>

            <div class="space-y-2 pt-1">
              <button onclick="app.clearContentCache()" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold">
                Clear Cached AI Lessons &amp; Challenges
              </button>
              <button onclick="app.resetAllProgress()" class="w-full py-3 rounded-xl bg-rose-950/60 hover:bg-rose-900/70 border border-rose-500/40 text-rose-300 text-xs font-bold">
                Reset All Game Progress
              </button>
            </div>
            <button onclick="app.closeModal()" class="w-full py-2.5 rounded-xl bg-slate-950 text-slate-400 text-xs font-semibold">
              Close
            </button>
          </div>
        `);
      }

      copySaveCode() {
        try {
          const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(this.state))));
          const input = document.getElementById("save-code-input");
          if (input) {
            input.value = encoded;
            input.select();
            document.execCommand("copy");
          }
          this.showToast("Save code copied to clipboard!", "emerald", "fa-solid fa-check");
        } catch (e) {
          this.showToast("Could not generate save code.", "rose");
        }
      }

      importSaveCode() {
        const input = document.getElementById("save-code-input");
        const raw = input?.value?.trim();
        if (!raw) {
          this.showToast("Paste your save code into the box first!", "amber");
          return;
        }
        try {
          const json = decodeURIComponent(escape(atob(raw)));
          const parsed = JSON.parse(json);
          if (!parsed || !parsed.languages) throw new Error("Invalid save format");
          this.state = { ...this.getDefaultState(), ...parsed };
          this.saveState();
          this.closeModal();
          this.renderAll();
          this.showToast("Progress restored! Welcome back.", "emerald", "fa-solid fa-rotate");
        } catch (e) {
          this.showToast("Invalid save code. Please copy it again.", "rose");
        }
      }

      saveCustomApiKey() {
        const input = document.getElementById("custom-api-key-input");
        if (!input) return;
        try {
          const val = input.value.trim();
          if (val) {
            localStorage.setItem("codequest_custom_api_key", val);
            this.showToast("Custom Gemini API key saved!", "emerald", "fa-solid fa-key");
          } else {
            localStorage.removeItem("codequest_custom_api_key");
            this.showToast("Reverted to default environment key.", "indigo", "fa-solid fa-key");
          }
        } catch (e) {}
        this.closeModal();
      }

      clearContentCache() {
        this.cache = {};
        localStorage.removeItem(this.cacheKey);
        this.closeModal();
        this.showToast("AI lesson cache cleared!", "indigo");
        this.renderAll();
      }

      resetAllProgress() {
        localStorage.removeItem(this.storageKey);
        this.state = this.getDefaultState();
        this.closeModal();
        this.navigate("home");
        this.showToast("Progress reset to Level 1.", "rose");
      }

      showModal(html) {
        const backdrop = document.getElementById("modal-backdrop");
        const content = document.getElementById("modal-content");
        if (!backdrop || !content) return;
        content.innerHTML = html;
        backdrop.classList.remove("hidden");
        backdrop.classList.add("flex");
      }

      closeModal() {
        const backdrop = document.getElementById("modal-backdrop");
        if (!backdrop) return;
        backdrop.classList.add("hidden");
        backdrop.classList.remove("flex");
      }
    }

    // Boot application on load
    let app;
    window.addEventListener("DOMContentLoaded", () => {
      app = new CodeQuestApp();
      app.init();
    });
  </script>
</body>
</html>
